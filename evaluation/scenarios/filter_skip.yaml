id: filter_skip
title: Cost gate skip is silent and has no commitment
description: >
  The cost/latency gate drops empty text, filler, and an immediate duplicate
  from the same speaker. Those turns are SILENT with no commitment. A skip
  is not recorded as NO_COMMITMENT. An acknowledgement between skips still
  passes the gate.
session_id: sess-filter-skip
turns:
  - turn_id: turn-empty
    speaker_role: user
    text: "   "
    created_at: "2026-09-26T00:00:00Z"
    expect:
      speech_action: SILENT
      status: null
      skipped_by_filter: true
      filter_reason: empty
      clarification_question: null
  - turn_id: turn-filler
    speaker_role: user
    text: "um"
    created_at: "2026-09-26T00:01:00Z"
    expect:
      speech_action: SILENT
      status: null
      skipped_by_filter: true
      filter_reason: filler
      clarification_question: null
  - turn_id: turn-ack
    speaker_role: user
    text: "Got it."
    created_at: "2026-09-26T00:02:00Z"
    expect:
      speech_action: SILENT
      status: NO_COMMITMENT
      skipped_by_filter: false
      filter_reason: pass
      is_acknowledgement: true
      is_intention_only: false
      clarification_question: null
  - turn_id: turn-duplicate
    speaker_role: user
    text: "Got it."
    created_at: "2026-09-26T00:03:00Z"
    expect:
      speech_action: SILENT
      status: null
      skipped_by_filter: true
      filter_reason: duplicate
      clarification_question: null
