id: clarification_then_unresolved
title: One clarification, then unresolved and silent
description: >
  An ambiguous commitment gets one CLARIFY. Further ambiguous turns on the
  same topic become UNRESOLVED_AMBIGUOUS and SILENT. The cap does not ask
  again.
session_id: sess-clarify-unresolved
turns:
  - turn_id: turn-1
    speaker_role: user
    text: "I'll handle the budget review soon."
    created_at: "2026-09-26T00:00:00Z"
    expect:
      speech_action: CLARIFY
      status: AWAITING_CLARIFICATION
      is_acknowledgement: false
      is_intention_only: false
      clarification_question_contains: budget-review
  - turn_id: turn-2
    speaker_role: user
    text: "Maybe the budget review sometime, I'm not sure."
    created_at: "2026-09-26T00:01:00Z"
    expect:
      speech_action: SILENT
      status: UNRESOLVED_AMBIGUOUS
      is_acknowledgement: false
      is_intention_only: false
      clarification_question: null
      same_commitment_as: turn-1
  - turn_id: turn-3
    speaker_role: user
    text: "Still fuzzy on the budget review."
    created_at: "2026-09-26T00:02:00Z"
    expect:
      speech_action: SILENT
      status: UNRESOLVED_AMBIGUOUS
      is_acknowledgement: false
      is_intention_only: false
      clarification_question: null
      same_commitment_as: turn-1
