id: intervened_blocks_confirm
title: Intervention blocks automatic confirmation
description: >
  A clear commitment spoken while intervened is DETECTED, not CONFIRMED, and
  speech stays SILENT. A later clear restatement of that commitment stays
  DETECTED because the existing row is still intervened.
session_id: sess-intervened
turns:
  - turn_id: turn-1
    speaker_role: user
    text: "I will send the proposal by Friday."
    created_at: "2026-09-26T00:00:00Z"
    intervened: true
    expect:
      speech_action: SILENT
      status: DETECTED
      is_acknowledgement: false
      is_intention_only: false
      intervened: true
      clarification_question: null
  - turn_id: turn-2
    speaker_role: user
    text: "I'll send the proposal by Friday."
    created_at: "2026-09-26T00:01:00Z"
    intervened: false
    expect:
      speech_action: SILENT
      status: DETECTED
      is_acknowledgement: false
      is_intention_only: false
      intervened: true
      clarification_question: null
      same_commitment_as: turn-1
