[project]
name = "veralock"
version = "0.2.0"
description = "VeraLock Brain (intelligence, state) and Vault (storage, evidence, followup)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
brain = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.32", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["."]
